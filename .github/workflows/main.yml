name: Bootstrap machineKey (rodar uma vez)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Sobrescrever chaves existentes"
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      REPO: ${{ github.repository }}
      FORCE: ${{ inputs.force }}
    steps:
      - name: Check token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret GH_ADMIN_TOKEN vazio ou inexistente neste repositorio"
            exit 1
          fi
          echo "token ok"

      - name: Generate and store keys
        run: |
          if gh secret list --repo "$REPO" | grep -q '^MACHINEKEY_VALIDATION' && [ "$FORCE" != "true" ]; then
            echo "Chaves ja existem."
            exit 0
          fi
          VK=$(openssl rand -hex 64 | tr a-f A-F)
          DK=$(openssl rand -hex 32 | tr a-f A-F)
          gh secret set MACHINEKEY_VALIDATION --repo "$REPO" --body "$VK"
          gh secret set MACHINEKEY_DECRYPTION --repo "$REPO" --body "$DK"
          echo "Chaves salvas."
